spring:
  application:
    name: githubsearch
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/github_search}
    username: ${DB_USERNAME:github_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

github:
  api-base-url: https://api.github.com
  token: ${GITHUB_TOKEN:}
  connect-timeout: 3s
  read-timeout: 10s