services:
  postgres:
    image: postgres:18
    container_name: github-search-db
    environment:
      POSTGRES_DB: github_search
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d github_search"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: